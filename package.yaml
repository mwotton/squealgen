name:                squealgen
version:             2.0.0
github:              "mwotton/squealgen"
license:             BSD3
author:              "Mark Wotton"
maintainer:          "mwotton@gmail.com"
copyright:           "2020 Mark Wotton"

extra-source-files:
- README.md
- ChangeLog.md
- squealgen
# - squealgen.sql

# Metadata used when publishing your package
synopsis:            generate squeal types from an existing database
category:            Database
description:         Please see the README on GitHub at <https://github.com/mwotton/squealgen#readme>

dependencies:
- base >= 4.7

data-files:
- squealgen.sql

executables:
  squealgen:
    main: Main.hs
    source-dirs: app
    dependencies:
    - process

tests:
  tests:
    main: Spec.hs
    source-dirs: test
    other-modules:
    - EmptySchema.DBSpec
    - EmptySchema.Public
    default-extensions:
    - DataKinds
    - DeriveGeneric
    - OverloadedLabels
    - FlexibleContexts
    - TypeApplications
    - TypeOperators
    - GADTs

    dependencies:
    - bytestring
    - hspec
    - hspec-expectations-lifted
    - squeal-postgresql >= 0.9.2.0
    - unliftio
    - generics-sop
    - text
    - tmp-postgres >= 1.34.1.0
    - containers
    - directory
    - network-ip
    - iproute
    - filepath
    - falsify
    - tasty
    - tasty-hspec
    - process
    - temporary

    # temp until merge
    - postgresql-binary
    - mtl
